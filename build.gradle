buildscript {
    repositories {
        maven {
            url "https://repository-cdn.liferay.com/nexus/content/groups/public"
        }
        mavenCentral()
    }
    dependencies {
        classpath group: "com.liferay", name: "com.liferay.gradle.plugins.theme.builder", version: "2.0.17"
    }
}

// 1. Explicitly apply the war plugin alongside the theme builder
apply plugin: "war"
apply plugin: "com.liferay.portal.tools.theme.builder"

// 2. Added root repositories block so the project can download its dependencies
repositories {
    maven {
        url "https://repository-cdn.liferay.com/nexus/content/groups/public"
    }
    mavenCentral()
}

war {
    archiveBaseName.set("avanzatheme")
}

dependencies {
    cssBuilder group: "com.liferay", name: "com.liferay.css.builder", version: "3.1.5"
    themeBuilder group: "com.liferay", name: "com.liferay.portal.tools.theme.builder", version: "1.1.9"
    
    // 3. Ensure these have versions if you are NOT using Liferay Workspace
    // (Replace 'x.x.x' with your specific Liferay version, e.g., '3.0.4')
    parentThemes group: "com.liferay", name: "com.liferay.frontend.theme.styled", version: "x.x.x"
    parentThemes group: "com.liferay", name: "com.liferay.frontend.theme.unstyled", version: "x.x.x"
    portalCommonCSS group: "com.liferay", name: "com.liferay.frontend.css.common", version: "x.x.x"
}
